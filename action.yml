name: "P6 GHA: Markdown Linter"
description: "P6 GHA: Markdown Linter"
author: "Philip M. Gollucci"

inputs:
  markdownlint:
    description: "Runs markdownlint"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Node
      if: ${{ inputs.markdownlint == 'true' }}
      uses: p6m7g8-actions/p6-node-setup@main

    - name: Install markdownlint-cli
      if: ${{ inputs.markdownlint == 'true' }}
      shell: bash
      run: npm install -g markdownlint-cli

    - name: Run markdownlint
      if: ${{ inputs.markdownlint == 'true' }}
      shell: bash
      run: |
        set -uo pipefail

        # A repo-committed config always wins, and must never be overwritten.
        config=""
        for candidate in \
          .markdownlint.json \
          .markdownlint.jsonc \
          .markdownlint.yaml \
          .markdownlint.yml; do
          if [[ -f "${candidate}" ]]; then
            config="${candidate}"
            echo "Using repo-committed ${config}."
            break
          fi
        done

        # No repo config: generate the 120-column default outside the workspace
        # so the working tree is not dirtied for later steps in the same job.
        if [[ -z "${config}" ]]; then
          config="${RUNNER_TEMP}/p6-markdownlint.json"
          printf '%s\n' \
            '{ "default": true, "MD013": { "line_length": 120, "code_block_line_length": 120 } }' \
            >"${config}"
          echo "Generated ${config}:"
          cat "${config}"
        fi

        markdownlint '**/*.md' --config "${config}" \
          --ignore node_modules --ignore components --ignore services
